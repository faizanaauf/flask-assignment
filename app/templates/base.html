<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personal Library Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-..." crossorigin="anonymous">
    <style>
      :root {
        color-scheme: dark;
        --bg: #090b10;
        --surface: #11151f;
        --surface-soft: #131a27;
        --surface-strong: #141a24;
        --text: #e8eefc;
        --muted: #7f8ca3;
        --primary: #7aa2ff;
        --success: #50d1a4;
        --danger: #ff7b8a;
        --border: rgba(255, 255, 255, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top left, rgba(122, 162, 255, 0.12), transparent 20%),
                    linear-gradient(180deg, #0b0f16 0%, #090b10 100%);
        color: var(--text);
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      nav.navbar {
        background: transparent;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        padding: 1rem 0;
      }

      .navbar-brand {
        font-weight: 700;
        color: var(--text) !important;
      }

      .nav-link {
        color: var(--muted) !important;
        transition: color 0.2s ease;
      }

      .nav-link:hover {
        color: var(--primary) !important;
      }

      .container {
        animation: fadeIn 0.6s ease both;
      }

      .surface,
      .surface-soft {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 22px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.24);
      }

      .surface-soft {
        background: var(--surface-soft);
      }

      .surface:hover {
        transform: translateY(-2px);
      }

      .card,
      .table-responsive,
      form {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 22px;
      }

      .card-body,
      .table-responsive,
      form {
        padding: 1.5rem;
      }

      h1,
      h2,
      h3,
      .form-label,
      .table th,
      .table td,
      p,
      label {
        color: var(--text);
      }

      .form-control,
      .form-select {
        background: #0e1320;
        border: 1px solid rgba(255, 255, 255, 0.10);
        color: var(--text);
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .form-control:focus,
      .form-select:focus {
        border-color: rgba(122, 162, 255, 0.35);
        box-shadow: 0 0 0 0.2rem rgba(122, 162, 255, 0.15);
        outline: none;
      }

      .form-label {
        color: var(--text);
      }

      .form-control::placeholder,
      .form-select option,
      .form-select::placeholder {
        color: var(--muted);
      }

      .btn,
      .btn-outline-primary,
      .btn-outline-secondary,
      .btn-outline-danger {
        border-radius: 999px;
        transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
      }

      .btn-primary {
        background: var(--primary);
        border: 1px solid transparent;
        color: #fff;
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: var(--text);
      }

      .btn-success {
        background: var(--success);
        border: 1px solid transparent;
        color: #09101b;
      }

      .btn-outline-primary,
      .btn-outline-secondary,
      .btn-outline-danger {
        color: var(--text);
        border-color: rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.03);
      }

      .btn:hover {
        transform: translateY(-1px);
      }

      .alert {
        background: rgba(19, 24, 34, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: var(--text);
        border-radius: 18px;
      }

      .alert-success {
        background: rgba(79, 209, 164, 0.14);
        border-color: rgba(79, 209, 164, 0.3);
      }

      .alert-danger {
        background: rgba(255, 123, 138, 0.14);
        border-color: rgba(255, 123, 138, 0.3);
      }

      .alert-info {
        background: rgba(122, 162, 255, 0.14);
        border-color: rgba(122, 162, 255, 0.3);
      }

      .table {
        color: var(--text);
        background: transparent !important;
        border-color: rgba(255, 255, 255, 0.08);
      }

      .table th,
      .table td {
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }

      .table thead th {
        color: var(--muted);
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        background: transparent;
      }

      .table tbody tr {
        transition: background 0.2s ease, transform 0.2s ease;
        background: rgba(255, 255, 255, 0.02);
      }

      .table-striped > tbody > tr:nth-of-type(odd) {
        background-color: rgba(255, 255, 255, 0.03);
      }

      .table-striped > tbody > tr:nth-of-type(even) {
        background-color: rgba(255, 255, 255, 0.01);
      }

      .table-hover tbody tr:hover,
      .table tbody tr:hover {
        background: rgba(122, 162, 255, 0.12);
        transform: translateX(3px);
      }

      .table-responsive {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 22px;
        overflow: hidden;
      }

      table.table {
        background: transparent !important;
      }

      table.table th,
      table.table td {
        color: var(--text);
      }

      /* Strong overrides to prevent Bootstrap defaults from showing white backgrounds */
      .table,
      .table thead,
      .table tbody,
      .table tr,
      .table th,
      .table td {
        background: transparent !important;
        color: var(--text) !important;
      }

      /* Ensure striped rows are subtle and dark */
      .table-striped > tbody > tr:nth-of-type(odd) > * {
        background-color: rgba(255, 255, 255, 0.02) !important;
      }
      .table-striped > tbody > tr:nth-of-type(even) > * {
        background-color: rgba(255, 255, 255, 0.01) !important;
      }

      /* Cell padding and readable link/button colors inside table */
      .table td,
      .table th {
        vertical-align: middle;
        padding: 0.9rem 1.2rem;
        color: var(--text) !important;
      }

      /* Action buttons inside table should be compact and visible */
      .table .btn {
        padding: 0.35rem 0.7rem;
        font-size: 0.85rem;
        border-radius: 12px;
      }

      .table a.btn-outline-primary {
        color: var(--primary) !important;
        border-color: rgba(122, 162, 255, 0.22) !important;
        background: transparent !important;
      }

      .table form.d-inline { display: inline-block; margin: 0; }

      /* Fix the delete confirmation button style so it doesn't float weirdly */
      .table form.d-inline button {
        vertical-align: middle;
      }

      .page-intro {
        animation: fadeIn 0.55s ease both;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body class="app-shell">
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container-fluid px-4">
        <a class="navbar-brand" href="{{ url_for('main.index') }}">Library Tracker</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('main.index') }}">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('main.create_book') }}">Add Book</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <div class="container my-4 page-intro">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ 'success' if category == 'success' else 'danger' if category == 'danger' else 'info' }} alert-dismissible fade show" role="alert">
              {{ message }}
              <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-..." crossorigin="anonymous"></script>
  </body>
</html>
